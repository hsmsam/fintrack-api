services:
  postgres:
    image: postgres:17
    container_name: fintrack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d fintrack" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: